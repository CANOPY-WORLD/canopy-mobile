<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="828" viewBox="0 0 1440 828" role="img" aria-labelledby="architecture-title architecture-description">
  <title id="architecture-title">Canopy: Scenario, Model, Asset and Visualizer</title>
  <desc id="architecture-description">A Scenario defines a scene, selects shared Models, owns private Assets and configures the shared Visualizer. Geometry tools produce Geometry assets. Physics simulators use Geometry and optionally existing Physics results to produce Physics assets. Both Geometry and Physics feed the Visualizer directly. Only model code is shared between scenarios; each scenario owns its geometry and physics results.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #293b34; }
      .heading { font-size: 36px; font-weight: 650; letter-spacing: -0.8px; }
      .subheading { font-size: 23px; fill: #61716a; }
      .node-title { font-size: 27px; font-weight: 600; letter-spacing: -0.3px; }
      .node-detail { font-size: 22px; fill: #61716a; }
      .edge-label { font-size: 22px; fill: #61716a; text-anchor: middle; }
      .control { fill: none; stroke: #84968b; stroke-width: 2; stroke-dasharray: 5 7; marker-end: url(#control-arrow); }
      .geometry-flow { fill: none; stroke: #688571; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .physics-flow { fill: none; stroke: #688495; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .card { fill: #ffffff; stroke: #dce2db; stroke-width: 1.5; }
    </style>
    <marker id="control-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#84968b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="geometry-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#688571" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="physics-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#688495" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1440" height="828" rx="24" fill="#f7f7f2"/>

  <!-- A scene configures shared tools and presentation; it owns only its assets. -->
  <g id="scenario">
    <rect x="56" y="48" width="1328" height="164" rx="22" fill="#e8eee6" stroke="#d7e0d4" stroke-width="1.5"/>
    <rect x="84" y="89" width="72" height="72" rx="18" fill="#d4e0d0"/>
    <g fill="none" stroke="#58715e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 101 110 L 114 105 L 126 110 L 139 105 L 139 138 L 126 143 L 114 138 L 101 143 Z"/>
      <path d="M 114 105 V 138 M 126 110 V 143"/>
    </g>
    <text x="180" y="119" class="heading">Scenario</text>
    <text x="181" y="155" class="subheading">scenario/</text>
    <path d="M 430 84 V 176" stroke="#ccd8c8" stroke-width="1.5"/>
    <text x="470" y="116" font-size="28" font-weight="500">Defines a scene and its configuration.</text>
    <text x="470" y="156" class="subheading">Space · task recipes · asset index · view settings</text>
  </g>

  <!-- These dashed links describe configuration and ownership, not data flow. -->
  <path class="control" d="M 240 212 V 312"/>
  <path class="control" d="M 732 212 V 312"/>
  <path class="control" d="M 1208 212 V 312"/>
  <g fill="#f7f7f2">
    <rect x="192" y="246" width="96" height="32" rx="8"/>
    <rect x="693" y="246" width="78" height="32" rx="8"/>
    <rect x="1145" y="246" width="126" height="32" rx="8"/>
  </g>
  <text x="240" y="269" class="edge-label">selects</text>
  <text x="732" y="269" class="edge-label">owns</text>
  <text x="1208" y="269" class="edge-label">configures</text>

  <g id="model">
    <rect x="56" y="312" width="368" height="460" rx="22" class="card"/>
    <text x="84" y="366" class="heading">Model</text>
    <text x="84" y="404" class="subheading">Shared across scenarios</text>
    <rect x="80" y="448" width="320" height="102" rx="15" fill="#eef3ea" stroke="#d5e0d0" stroke-width="1.5"/>
    <text x="104" y="488" class="node-title">Geometry tools</text>
    <text x="104" y="523" class="node-detail">Generate and process</text>
    <rect x="80" y="634" width="320" height="102" rx="15" fill="#edf2f5" stroke="#d5e0e6" stroke-width="1.5"/>
    <text x="104" y="674" class="node-title">Physics simulators</text>
    <text x="104" y="709" class="node-detail">Run a shared method</text>
  </g>

  <g id="asset">
    <rect x="544" y="312" width="376" height="460" rx="22" class="card"/>
    <text x="572" y="366" class="heading">Asset</text>
    <text x="572" y="404" class="subheading">Owned by each Scenario</text>
    <rect x="568" y="448" width="328" height="102" rx="15" fill="#eef3ea" stroke="#d5e0d0" stroke-width="1.5"/>
    <text x="592" y="488" class="node-title">Geometry</text>
    <text x="592" y="523" class="node-detail">GLB + compute data</text>
    <rect x="568" y="634" width="328" height="102" rx="15" fill="#edf2f5" stroke="#d5e0e6" stroke-width="1.5"/>
    <text x="592" y="674" class="node-title">Physics results</text>
    <text x="592" y="709" class="node-detail">Fields · trajectories</text>
  </g>

  <g id="visualizer">
    <rect x="1032" y="312" width="352" height="460" rx="22" class="card"/>
    <text x="1060" y="366" class="heading">Visualizer</text>
    <text x="1060" y="404" class="subheading">One shared template</text>
    <rect x="1056" y="448" width="304" height="288" rx="15" fill="#f6f8f3" stroke="#dbe3d7" stroke-width="1.5"/>

    <!-- A compact, illustrative scene: displayed geometry and a physical field. -->
    <g aria-hidden="true" stroke-linejoin="round">
      <path d="M 1118 570 L 1208 518 L 1298 570 L 1208 622 Z" fill="#e1e9dd" stroke="#b5c7b0" stroke-width="1.5"/>
      <g fill="none" stroke="#94ac96" stroke-width="1.5">
        <path d="M 1137 580 C 1160 561 1169 588 1208 563 S 1254 565 1278 558"/>
        <path d="M 1154 591 C 1173 574 1196 594 1222 576 S 1268 579 1280 581"/>
        <path d="M 1180 606 C 1206 581 1214 605 1258 593"/>
      </g>
      <path d="M 1210 524 L 1231 512 L 1252 524 L 1231 536 Z" fill="#e7ece7" stroke="#8fa396" stroke-width="1.3"/>
      <path d="M 1210 524 L 1231 536 V 571 L 1210 559 Z" fill="#9fb2a3" stroke="#8fa396" stroke-width="1.3"/>
      <path d="M 1231 536 L 1252 524 V 559 L 1231 571 Z" fill="#6f8a78" stroke="#6f8a78" stroke-width="1.3"/>
      <path d="M 1163 519 L 1188 505 L 1213 519 L 1188 533 Z" fill="#edf1eb" stroke="#8fa396" stroke-width="1.3"/>
      <path d="M 1163 519 L 1188 533 V 589 L 1163 575 Z" fill="#9fb2a3" stroke="#8fa396" stroke-width="1.3"/>
      <path d="M 1188 533 L 1213 519 V 575 L 1188 589 Z" fill="#6f8a78" stroke="#6f8a78" stroke-width="1.3"/>
      <path d="M 1195 594 C 1211 592 1218 586 1230 578" fill="none" stroke="#6b8d9b" stroke-width="3" stroke-linecap="round"/>
      <path d="M 1221 577 L 1231 577 L 1229 586" fill="none" stroke="#6b8d9b" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="1208" y="666" text-anchor="middle" font-size="25" font-weight="600">Geometry + physics</text>
    <text x="1208" y="702" text-anchor="middle" font-size="21" fill="#61716a">Read, inspect and compare</text>
  </g>

  <!-- Exported Geometry and Physics each have a direct path to the Visualizer. -->
  <path class="geometry-flow" marker-end="url(#geometry-arrow)" d="M 400 499 H 568"/>
  <path class="physics-flow" marker-end="url(#physics-arrow)" d="M 400 685 H 568"/>
  <path class="geometry-flow" marker-end="url(#geometry-arrow)" d="M 896 499 H 1056"/>
  <path class="physics-flow" marker-end="url(#physics-arrow)" d="M 896 685 H 1056"/>
  <text x="484" y="483" class="edge-label">produce</text>
  <text x="484" y="669" class="edge-label">produce</text>
  <text x="976" y="483" class="edge-label">read</text>
  <text x="976" y="669" class="edge-label">read</text>

  <!-- Geometry is required input; a retained Physics result may also be input. -->
  <path class="geometry-flow" d="M 732 550 V 586"/>
  <path class="physics-flow" stroke-dasharray="5 6" d="M 732 634 V 586"/>
  <circle cx="732" cy="586" r="4" fill="#688495"/>
  <path class="physics-flow" marker-end="url(#physics-arrow)" d="M 728 586 H 256 Q 240 586 240 602 V 634"/>
  <text x="484" y="576" class="edge-label">inputs</text>
  <text x="752" y="617" font-size="20" fill="#688495">optional</text>
</svg>
